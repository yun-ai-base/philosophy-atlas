<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脉络 · 思想之河 — 儒家思想卡原型</title>
<meta name="description" content="脉络·思想之河——人类哲学之河。儒家思想卡原型：时代之问、多元阐释、分歧争议、接受史、四轴发散。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────────── 设计系统（思想之河 v7） ───────────── */
:root {
  --bg: #0B0E14;
  --bg-2: #0E1219;
  --panel: #121826;
  --panel-2: #161E2E;
  --line: rgba(201,160,99,0.16);
  --line-soft: rgba(255,255,255,0.06);
  --gold: #C9A063;
  --gold-bright: #E8D8B8;
  --ivory: #EFE9DC;
  --text: #EFE9DC;
  --text-dim: #A9A295;
  --text-mute: #8A857A;

  /* 文明/支流色 */
  --c-eastern: #C9A063;
  --c-western: #7FA8D9;
  --c-greek: #4FB3A8;
  --c-indian: #C05A4A;
  --c-islamic: #3E9E8A;
  --c-europe: #7FA8D9;
  --c-modern: #8B7EC8;

  /* 学科色 */
  --d-religion: #B05A7A;
  --d-science: #4FB3A8;
  --d-literature: #E8A33D;
  --d-art: #8B7EC8;

  /* 关系色 */
  --r-source: #C9A063;
  --r-inherit: #E8D8B8;
  --r-transcend: #8B7EC8;
  --r-reject: #E05D5D;
  --r-dialogue: #E8A33D;
  --r-resonance: #4FB3A8;

  --radius: 14px;
  --font-serif: 'Noto Serif SC', 'Georgia', serif;
  --font-wenkai: 'LXGW WenKai', 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
  --font-sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'DM Mono', 'SF Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* 背景：网格纸 + 双色光晕 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(50% 40% at 30% 0%, rgba(201,160,99,0.07), transparent 60%),
    radial-gradient(45% 35% at 80% 80%, rgba(127,168,217,0.06), transparent 60%);
  pointer-events: none;
  z-index: 0;
}
.grid-paper {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}
main { position: relative; z-index: 1; }

/* ───────────── 顶栏 ───────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  background: rgba(11,14,20,0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 28px;
  height: 54px;
}
.brand {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--gold-bright);
  white-space: nowrap;
}
.brand .en {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.2em;
  color: var(--text-mute);
  margin-left: 10px;
}
.brand-mark { color: var(--gold); margin-right: 2px; }
.topbar-hint {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-mute);
  letter-spacing: 0.06em;
  white-space: nowrap;
}

/* 顶栏搜索 */
.search-box { position: relative; margin-left: 20px; }
.search-box input {
  width: 200px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 100px;
  background: rgba(11,14,20,0.6);
  color: var(--text);
  font-size: 12.5px;
  font-family: var(--font-sans);
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--gold); }
.search-results {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  z-index: 80;
  display: none;
  max-height: min(360px, calc(100vh - 120px));
  overflow-y: auto;
}
.search-results.open { display: block; }
.search-results .sr-item {
  padding: 9px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--text);
  border-bottom: 1px solid var(--line-soft);
}
.search-results .sr-item:last-child { border-bottom: none; }
.search-results .sr-item:hover { background: rgba(201,160,99,0.08); }
.search-results .sr-item .sr-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.search-results .sr-item .sr-type { font-size: 10px; color: var(--text-mute); margin-left: auto; font-family: var(--font-mono); }
.search-results .sr-empty { padding: 12px 14px; font-size: 12px; color: var(--text-mute); }

/* 航行按钮 */
.nav-btn {
  padding: 6px 14px;
  border: 1px solid var(--gold);
  border-radius: 100px;
  background: color-mix(in srgb, var(--gold) 14%, transparent);
  color: var(--gold-bright);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  margin-left: 10px;
}
.nav-btn:hover { background: color-mix(in srgb, var(--gold) 24%, transparent); }
.nav-btn.running { background: color-mix(in srgb, var(--gold) 30%, transparent); }

/* 读者入口（逆流寻源） */
.reader-entry {
  margin-top: 20px;
  display: flex;
  gap: 8px;
  max-width: 460px;
}
.reader-entry input {
  flex: 1;
  padding: 10px 16px;
  border: 1px solid var(--line);
  border-radius: 100px;
  background: rgba(11,14,20,0.6);
  color: var(--text);
  font-size: 13.5px;
  font-family: var(--font-sans);
  outline: none;
}
.reader-entry input:focus { border-color: var(--gold); }
.reader-entry button {
  padding: 10px 18px;
  border: 1px solid var(--gold);
  border-radius: 100px;
  background: var(--gold);
  color: #0B0E14;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.reader-entry button:hover { background: var(--gold-bright); }

/* 序章（贝纳德相变） */
.prologue {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: radial-gradient(ellipse at center, #1a2233 0%, #0B0E14 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  transition: opacity 0.8s ease;
}
.prologue.hidden { opacity: 0; pointer-events: none; }
.prologue-stage {
  width: min(560px, 90vw);
  height: 420px;
  position: relative;
}
.prologue-stage canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.prologue-caption {
  margin-top: 16px;
  font-family: var(--font-wenkai);
  font-size: 20px;
  color: var(--gold-bright);
  letter-spacing: 0.08em;
  text-align: center;
  min-height: 36px;
}
.prologue-caption .sub {
  display: block;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text-mute);
  margin-top: 6px;
  letter-spacing: 0.04em;
}
.prologue-skip {
  position: absolute;
  top: 20px;
  right: 24px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 100px;
  background: rgba(11,14,20,0.6);
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  z-index: 205;
  transition: all 0.2s;
}
.prologue-skip:hover { color: var(--text); border-color: var(--gold); }

/* 河段导航 */
.reach-nav {
  display: flex;
  gap: 6px;
  padding: 10px 16px;
  border-top: 1px solid var(--line-soft);
  flex-wrap: wrap;
}
.reach-btn {
  padding: 4px 12px;
  border: 1px solid var(--line-soft);
  border-radius: 100px;
  font-size: 11.5px;
  color: var(--text-dim);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.reach-btn:hover { border-color: var(--gold); color: var(--text); }
.reach-btn.active { background: color-mix(in srgb, var(--gold) 14%, transparent); border-color: var(--gold); color: var(--gold-bright); }

/* 时代事件（能量流上轨） */
.event-pin { cursor: pointer; }
.event-pin text { font-size: 9.5px; }
.event-pin:hover text { fill: #EFE9DC; }
.event-pulse { cursor: pointer; }
.event-pulse:hover { opacity: 1 !important; }

/* ───────────── Hero ───────────── */
.hero {
  max-width: 1180px;
  margin: 0 auto;
  padding: 56px 28px 12px;
}
.hero-kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.28em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero-kicker::before { content: ''; width: 24px; height: 1px; background: var(--gold); opacity: 0.6; }
.hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 900;
  letter-spacing: 0.04em;
  color: var(--text);
  line-height: 1.3;
}
.hero h1 .cn { color: var(--gold); }
.hero-sub {
  margin-top: 14px;
  font-size: 14px;
  color: var(--text-dim);
  max-width: 44em;
  line-height: 1.8;
}
.hero-sub b { color: var(--gold-bright); font-weight: 600; }

/* ───────────── 学派卡片区 ───────────── */
.schools-section {
  max-width: 1180px;
  margin: 0 auto;
  padding: 30px 28px 0;
}
.schools-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
}
.schools-title { font-family: var(--font-serif); font-size: 20px; font-weight: 700; color: var(--text); }
.schools-sub { font-size: 12.5px; color: var(--text-mute); }

.school-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.school-card {
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 20px;
  background: linear-gradient(180deg, rgba(18,24,38,0.6), rgba(11,14,20,0.5));
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}
.school-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--sc, var(--gold));
  opacity: 0;
  transition: opacity 0.25s;
}
.school-card:hover {
  border-color: var(--line);
  transform: translateY(-2px);
  background: rgba(22,30,46,0.8);
}
.school-card:hover::before { opacity: 1; }
.school-card .sc-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-mute);
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.school-card .sc-tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sc, var(--gold)); }
.school-card h3 { font-family: var(--font-serif); font-size: 19px; font-weight: 700; color: var(--text); }
.school-card .sc-era { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.school-card .sc-quote {
  margin-top: 12px;
  font-family: var(--font-wenkai);
  font-size: 13px;
  color: var(--gold-bright);
  font-style: italic;
  line-height: 1.7;
  border-left: 2px solid var(--sc, var(--gold));
  padding-left: 12px;
}
.school-card .sc-concepts { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 5px; }
.school-card .sc-c {
  font-size: 10.5px;
  padding: 1px 8px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--sc, var(--gold)) 12%, transparent);
  color: var(--text-dim);
}

/* ───────────── 河流主干视图 ───────────── */
.river-section {
  max-width: 1180px;
  margin: 0 auto;
  padding: 40px 28px 0;
}
.river-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}
.river-title { font-family: var(--font-serif); font-size: 20px; font-weight: 700; color: var(--text); }
.river-sub { font-size: 12.5px; color: var(--text-mute); }

/* 视角切换器 */
.view-toggle { display: flex; gap: 6px; }
.view-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border: 1px solid var(--line-soft);
  border-radius: 100px;
  font-size: 12px;
  color: var(--text-dim);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.view-btn:hover { border-color: var(--gold); color: var(--text); }
.view-btn.active {
  background: color-mix(in srgb, var(--gold) 16%, transparent);
  border-color: var(--gold);
  color: var(--gold-bright);
}
.view-btn .vb-icon { font-size: 11px; }

.river-stage {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    radial-gradient(40% 60% at 50% 0%, rgba(201,160,99,0.05), transparent 70%),
    linear-gradient(180deg, rgba(18,24,38,0.7), rgba(11,14,20,0.9));
  overflow: hidden;
}
.river-svg { display: block; width: 100%; height: auto; }

/* 河流上的学派之舟（SVG 内可点击） */
.river-boat { cursor: pointer; }
.river-boat circle { transition: all 0.25s ease; }
.river-boat:hover circle { stroke: #EFE9DC; stroke-width: 2.5; }
.river-boat .boat-label {
  font-family: var(--font-serif);
  font-size: 11px;
  fill: rgba(239,233,220,0.85);
  text-anchor: middle;
}
.river-boat:hover .boat-label { fill: #EFE9DC; }

/* 支流汇入动画 */
@keyframes tributaryFlow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -60; } }
.tributary-flow { stroke-dasharray: 6 6; animation: tributaryFlow 3s linear infinite; }

/* 河流图例 */
.river-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 12px 16px;
  border-top: 1px solid var(--line-soft);
  font-size: 11.5px;
  color: var(--text-dim);
}
.river-legend .rl-item { display: inline-flex; align-items: center; gap: 6px; }
.river-legend .rl-dot { width: 10px; height: 10px; border-radius: 50%; }
.river-legend .rl-line { width: 22px; height: 2px; border-radius: 2px; }

/* ───────────── 思想卡弹层 ───────────── */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,8,15,0.74);
  backdrop-filter: blur(8px);
  z-index: 90;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.detail-overlay.open { display: flex; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.detail-panel {
  width: min(700px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line);
  border-radius: 18px;
  position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,160,99,0.08);
  animation: panelUp 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
@keyframes panelUp { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: none; } }
.detail-close {
  position: sticky;
  top: 12px;
  float: right;
  margin: 12px;
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(11,14,20,0.8);
  color: var(--text-dim);
  font-size: 18px;
  cursor: pointer;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.detail-close:hover { color: var(--text); border-color: var(--gold); }

/* hero */
.detail-hero {
  padding: 30px 30px 20px;
  border-bottom: 1px solid var(--line-soft);
  position: relative;
}
.detail-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(60% 80% at 20% 0%, color-mix(in srgb, var(--sc, var(--gold)) 13%, transparent), transparent 70%);
  pointer-events: none;
}
.detail-hero-top { display: flex; gap: 18px; align-items: flex-start; position: relative; }
.avatar-block {
  width: 72px; height: 72px;
  flex: 0 0 72px;
  border-radius: 16px;
  background:
    radial-gradient(60% 60% at 30% 25%, rgba(255,255,255,0.28), transparent 60%),
    var(--sc, var(--gold));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 900;
  color: rgba(0,0,0,0.72);
  box-shadow: 0 6px 24px color-mix(in srgb, var(--sc, var(--gold)) 40%, transparent);
}
.detail-name h2 { font-family: var(--font-serif); font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.3; }
.detail-name .en { font-size: 12.5px; color: var(--text-mute); letter-spacing: 0.08em; margin-top: 2px; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--text-dim); position: relative; }
.detail-meta .meta-item { display: flex; align-items: center; gap: 5px; }
.detail-meta .meta-item b { color: var(--gold-bright); font-weight: 500; }

/* 时代之问 */
.time-asked {
  margin: 18px 30px 0;
  padding: 16px 20px;
  border-left: 3px solid var(--gold);
  background: rgba(201,160,99,0.05);
  border-radius: 0 10px 10px 0;
  font-family: var(--font-wenkai);
  font-size: 15.5px;
  color: var(--gold-bright);
  line-height: 1.8;
  position: relative;
}
.time-asked .ta-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.24em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 6px;
}

/* body blocks */
.detail-body { padding: 20px 30px 34px; }
.d-block { margin-bottom: 26px; }
.d-block:last-child { margin-bottom: 0; }
.d-block-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.d-block-title::before { content: ''; width: 18px; height: 1px; background: var(--gold); opacity: 0.5; }

/* 多元阐释 */
.interp-list { display: grid; gap: 10px; }
.interp-item {
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  padding: 13px 15px;
  background: rgba(11,14,20,0.4);
}
.interp-item .ip-from {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  font-family: var(--font-serif);
}
.interp-item .ip-stance {
  font-size: 10.5px;
  padding: 1px 8px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--sc, var(--gold)) 14%, transparent);
  color: var(--gold-bright);
  border: 1px solid color-mix(in srgb, var(--sc, var(--gold)) 30%, transparent);
}
.interp-item .ip-view { font-size: 13px; color: var(--text-dim); margin-top: 6px; line-height: 1.75; }

/* 争议 */
.controversy-item {
  border: 1px solid rgba(224,93,93,0.25);
  border-radius: 10px;
  padding: 13px 15px;
  background: rgba(224,93,93,0.04);
  margin-bottom: 10px;
}
.controversy-item .ct-topic { font-size: 13.5px; font-weight: 600; color: var(--text); font-family: var(--font-serif); }
.controversy-item .ct-sides { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.controversy-item .ct-side {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 100px;
  border: 1px solid var(--line-soft);

      if (!q.trim()) { results.classList.remove('open'); return; }
      var hits = [];
      Object.keys(SCHOOLS).forEach(function (id) {
        var s = SCHOOLS[id];
        var hay = s.name + s.en + (s.concepts || []).join('') + s.timeAsked;
        if (hay.indexOf(q) >= 0) hits.push({ type: '学派', id: id, name: s.name, tributary: s.tributary });
      });
      Object.keys(CONCEPT_FLOWS).forEach(function (c) {
        if (c.indexOf(q) >= 0) hits.push({ type: '概念', id: c, name: c, concept: true });
      });
      if (!hits.length) {
        results.innerHTML = '<div class="sr-empty">未找到「' + q + '」相关思想</div>';
      } else {
        results.innerHTML = hits.slice(0, 8).map(function (h) {
          var col = h.concept ? '#C9A063' : (TRIBUTARY_COLOR[h.tributary] || '#C9A063');
          return '<div class="sr-item" data-school="' + h.id + '" data-concept="' + (h.concept ? '1' : '0') + '">'

        }).join('');

        item.addEventListener('click', function () {
          var isConcept = item.getAttribute('data-concept') === '1';

          }
        });
      });

        if (shown2[s.tributary]) return;
        shown2[s.tributary] = true;
        lh += '<span class="rl-item"><span class="rl-dot" style="background:' + (TRIBUTARY_COLOR[s.tributary] || '#C9A063') + '"></span>'
          + (TRIBUTARY_NAME[s.tributary] || s.tributary) + '</span>';
      });
      lh += '<span class="rl-item"><span class="rl-line" style="background:#C9A063"></span>主干 · 人类哲学</span>';
    }
    legend.innerHTML = lh;
  }

  // 视角切换
  document.getElementById('viewToggle').addEventListener('click', function (ev) {
    var btn = ev.target.closest('.view-btn');
    if (!btn) return;
    viewMode = btn.getAttribute('data-view');
    document.querySelectorAll('.view-btn').forEach(function (b) { b.classList.toggle('active', b === btn); });
    renderRiver();
  });

  /* ─── 时代能量流（事件上轨） + 支流脉冲 ─── */
  var activeEvent = null;
  function renderEvents() {
    var container = document.getElementById('riverCanvas');
    var svgEl = container.querySelector('.river-svg');
    if (!svgEl || viewMode !== 'river') return;
    // 在 SVG 顶部叠加事件标记
    var ns = 'http://www.w3.org/2000/svg';
    var W = 1100, pad = 40;
    var yearMin = -800, yearMax = 1900;
    function xFor(year) { return pad + (year - yearMin) / (yearMax - yearMin) * (W - pad * 2); }
    var cy = 190;
    EVENTS.forEach(function (ev) {
      var g = document.createElementNS(ns, 'g');
      g.setAttribute('class', 'event-pin' + (activeEvent === ev.id ? ' active' : ''));
      g.setAttribute('data-event', ev.id);
      g.setAttribute('style', 'cursor:pointer');
      var x = xFor(ev.year);
      var line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', x); line.setAttribute('y1', cy - 90);
      line.setAttribute('x2', x); line.setAttribute('y2', cy - 56);
      line.setAttribute('stroke', ev.color); line.setAttribute('stroke-width', '1.5'); line.setAttribute('stroke-opacity', activeEvent === ev.id ? '0.9' : '0.4');
      line.setAttribute('stroke-dasharray', '3 2');
      var circle = document.createElementNS(ns, 'circle');
      circle.setAttribute('cx', x); circle.setAttribute('cy', cy - 56);
      circle.setAttribute('r', activeEvent === ev.id ? 5 : 3.5);
      circle.setAttribute('fill', ev.color);
      var txt = document.createElementNS(ns, 'text');
      txt.setAttribute('x', x); txt.setAttribute('y', cy - 78);
      txt.setAttribute('fill', ev.color); txt.setAttribute('font-size', '9.5'); txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('font-family', 'Noto Serif SC, serif');
      txt.textContent = ev.name;
      g.appendChild(line); g.appendChild(circle); g.appendChild(txt);
      g.addEventListener('click', function () { pulseEvent(ev.id); });
      svgEl.appendChild(g);
    });
  }

  function pulseEvent(evId) {
    var ev = null;
    EVENTS.forEach(function (e) { if (e.id === evId) ev = e; });
    if (!ev) return;
    activeEvent = activeEvent === evId ? null : evId;
    renderRiver();
    renderEvents();
    if (!activeEvent) return;
    // 点亮触发学派
    ev.triggered.forEach(function (sid) {
      var el = document.querySelector('.river-boat[data-school="' + sid + '"]');
      if (el) {
        el.style.opacity = '1';
        var circle = el.querySelector('ellipse');
        if (circle) circle.setAttribute('stroke-width', '3');
      }
    });
    // 图例提示
    var legend = document.getElementById('riverLegend');
    legend.innerHTML = '<span class="rl-item" style="color:' + ev.color + '">⚡ ' + ev.name + ' · ' + ev.desc + '</span>'
      + '<span class="rl-item">触发 ' + ev.triggered.length + ' 个学派</span>'
      + '<span class="rl-item" style="cursor:pointer" onclick="document.getElementById(\'riverLegend\').innerHTML=\'\'">✕ 收起</span>';
  }

  /* ─── 逆流寻源（读者入口） ─── */
  document.getElementById('readerBtn').addEventListener('click', function () { doReaderSearch(); });
  document.getElementById('readerInput').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') doReaderSearch();
  });
  function doReaderSearch() {
    var q = document.getElementById('readerInput').value.trim();
    if (!q) return;
    var matched = null;
    READER_MAP.forEach(function (m) {
      m.kw.split('|').forEach(function (k) { if (q.indexOf(k) >= 0) matched = m; });
    });
    if (matched) {
      // 打开第一个学派思想卡，提示"你的困惑"对应的时代之问
      openSchool(matched.schools[0]);
      // 延迟在弹层顶部显示"逆流寻源"结果
      setTimeout(function () {
        var hero = document.querySelector('#detailContent .detail-hero');
        if (hero) {
          var badge = document.createElement('div');
          badge.style.cssText = 'font-family:var(--font-mono);font-size:10.5px;color:var(--gold);margin-bottom:8px;letter-spacing:0.1em;';
          badge.textContent = '◈ 逆流寻源 · 你的困惑「' + q + '」→ ' + matched.mq;
          hero.insertBefore(badge, hero.firstChild);
        }
      }, 100);
    } else {
      openSchool('confucianism');
      setTimeout(function () {
        var hero = document.querySelector('#detailContent .detail-hero');
        if (hero) {
          var badge = document.createElement('div');
          badge.style.cssText = 'font-family:var(--font-mono);font-size:10.5px;color:var(--gold);margin-bottom:8px;letter-spacing:0.1em;';
          badge.textContent = '◈ 「' + q + '」 是贯穿人类哲学的问题——从儒家看起';
          hero.insertBefore(badge, hero.firstChild);
        }
      }, 100);
    }
  }

  /* ─── 顺流而下自动航行 ─── */
  var navRunning = false;
  var navTimer = null;
  var navIdx = 0;
  document.getElementById('navBtn').addEventListener('click', function () { toggleNav(); });
  function toggleNav() {
    if (navRunning) { stopNav(); return; }
    navRunning = true;
    document.getElementById('navBtn').textContent = '⏸ 暂停';
    document.getElementById('navBtn').classList.add('running');
    navIdx = 0;
    runNavStep();
  }
  function runNavStep() {
    if (!navRunning) return;
    if (navIdx >= REACHES.length) { stopNav(); return; }
    var reach = REACHES[navIdx];
    // 高亮当前河段
    document.querySelectorAll('.reach-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-reach') === reach.id);
    });
    // 聚焦河流：滚动到河段中心
    var container = document.getElementById('riverCanvas');
    var firstBoat = container.querySelector('.river-boat');
    // 显示河段主题
    var legend = document.getElementById('riverLegend');
    legend.innerHTML = '<span class="rl-item" style="color:var(--gold-bright)">▶ ' + reach.name + ' · ' + reach.theme + '</span>';
    navTimer = setTimeout(function () {
      navIdx++;
      runNavStep();
    }, 1800);
  }
  function stopNav() {
    navRunning = false;
    document.getElementById('navBtn').textContent = '▶ 顺流';
    document.getElementById('navBtn').classList.remove('running');
    if (navTimer) clearTimeout(navTimer);
    document.querySelectorAll('.reach-btn').forEach(function (b) { b.classList.remove('active'); });
    var legend = document.getElementById('riverLegend');
    renderRiver();
    renderEvents();
    legend.innerHTML = '<span class="rl-item"><span class="rl-line" style="background:#C9A063"></span>主干 · 人类哲学</span>';
  }

  /* ─── 序章（贝纳德相变五幕） ─── */
  var prologueShown = false;
  function initPrologue() {
    var stage = document.getElementById('prologueStage');
    if (!stage) return;
    var canvas = document.createElement('canvas');
    canvas.width = 560; canvas.height = 420;
    stage.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var caption = document.getElementById('prologueCaption');
    var skipBtn = document.getElementById('prologueSkip');
    var step = 0;
    var phase = 0; // 0=湍流, 1=自组织
    var t = 0;
    var cells = [];
    var rows = 12, cols = 16;
    function buildCells() {
      cells = [];
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          cells.push({
            x: c / cols * 560, y: r / rows * 420,
            w: 560 / cols, h: 420 / rows,
            order: Math.random(),
            turb: PROLOGUE_STEPS[step] ? PROLOGUE_STEPS[step].turbulence : 0.5
          });
        }
      }
    }
    buildCells();
    function animate() {
      var st = PROLOGUE_STEPS[step];
      ctx.clearRect(0, 0, 560, 420);
      var turbulence = st ? st.turbulence : 0.5;
      // 贝纳德对流：细胞随湍流翻腾，相变时自组织成六角花纹
      t += 0.03;
      cells.forEach(function (cell) {
        var phase2 = Math.min(1, t * 0.4);
        var wob = Math.sin(t * 3 + cell.x * 0.05 + cell.y * 0.03);
        var offsetX = wob * turbulence * (1 - phase2) * 8;
        var offsetY = Math.cos(t * 2.6 + cell.y * 0.04) * turbulence * (1 - phase2) * 6;
        var intensity = 0.25 + phase2 * (0.5 + 0.3 * Math.sin(cell.order * Math.PI * 6 + t * 2));
        ctx.fillStyle = 'rgba(' + hexToRgb(st.color) + ',' + intensity.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(cell.x + offsetX, cell.y + offsetY);
        ctx.lineTo(cell.x + cell.w + offsetX, cell.y + offsetY);
        ctx.lineTo(cell.x + cell.w + offsetX, cell.y + cell.h + offsetY);
        ctx.lineTo(cell.x + offsetX, cell.y + cell.h + offsetY);
        ctx.closePath();
        ctx.fill();
      });
      // 相变完成 → 进入下一幕
      if (t > 3.2) {
        step++;
        t = 0;
        if (step >= PROLOGUE_STEPS.length) { finishPrologue(); return; }
        buildCells();
        caption.innerHTML = PROLOGUE_STEPS[step].title
          + '<span class="sub">' + PROLOGUE_STEPS[step].sub + '</span>';
      } else if (step === 0) {
        caption.innerHTML = PROLOGUE_STEPS[0].title
          + '<span class="sub">' + PROLOGUE_STEPS[0].sub + '</span>';
      }
      requestAnimationFrame(animate);
    }
    function hexToRgb(h) { var x = h.replace('#',''); var r = parseInt(x.substr(0,2),16), g = parseInt(x.substr(2,2),16), b = parseInt(x.substr(4,2),16); return r + ',' + g + ',' + b; }
    function finishPrologue() {
      prologueShown = true;
      document.getElementById('prologue').classList.add('hidden');
      setTimeout(function () {
        document.getElementById('prologue').style.display = 'none';
      }, 900);
    }
    skipBtn.addEventListener('click', finishPrologue);
    requestAnimationFrame(animate);
  }

  /* ─── 河段导航条 ─── */
  (function initReachNav() {
    var navEl = document.createElement('div');
    navEl.className = 'reach-nav';
    REACHES.forEach(function (r) {
      var b = document.createElement('button');
      b.className = 'reach-btn';
      b.setAttribute('data-reach', r.id);
      b.textContent = r.name;
      b.addEventListener('click', function () {
        document.querySelectorAll('.reach-btn').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        var legend = document.getElementById('riverLegend');
        legend.innerHTML = '<span class="rl-item" style="color:var(--gold-bright)">『' + r.name + '』 ' + r.theme + '</span>';
      });
      navEl.appendChild(b);
    });
    var stage = document.querySelector('.river-stage');
    if (stage) stage.appendChild(navEl);
  })();

  renderRiver();
  renderEvents();
  initPrologue();

  /* ─── 卡片渲染 ─── */
  var grid = document.getElementById('schoolGrid');
  var html = '';
  Object.keys(SCHOOLS).forEach(function (id) {
    var s = SCHOOLS[id];
    var col = TRIBUTARY_COLOR[s.tributary] || '#C9A063';
    var concepts = (s.concepts || []).slice(0, 5).map(function (c) {
      return '<span class="sc-c">' + c + '</span>';
    }).join('');
    html += '<div class="school-card" data-school="' + s.id + '" style="--sc:' + col + '">'
      + '<div class="sc-tag"><span class="dot"></span>' + TRIBUTARY_NAME[s.tributary] + ' · ' + s.era + '</div>'
      + '<h3>' + s.name + '</h3>'
      + '<div class="sc-era">' + s.en + '</div>'
      + '<div class="sc-quote">「' + s.primaryQuote + '」</div>'
      + (concepts ? '<div class="sc-concepts">' + concepts + '</div>' : '')
      + '</div>';
  });
  grid.innerHTML = html;

  /* ─── 弹层 ─── */
  var overlay = document.getElementById('detailOverlay');
  var panel = document.getElementById('detailPanel');
  var contentEl = document.getElementById('detailContent');

  function openOverlay() {
    overlay.classList.add('open');
    document.body.classList.add('modal-open');
    panel.scrollTop = 0;
  }
  function closeOverlay() {
    overlay.classList.remove('open');
    document.body.classList.remove('modal-open');
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function openSchool(id) {
    var s = SCHOOLS[id];
    if (!s) return;
    var col = TRIBUTARY_COLOR[s.tributary] || '#C9A063';

    // 多元阐释
    var interps = (s.interpretations || []).map(function (it) {
      return '<div class="interp-item">'
        + '<div class="ip-from">' + esc(it.from) + '<span class="ip-stance">' + esc(it.stance) + '</span></div>'
        + '<div class="ip-view">' + esc(it.view) + '</div></div>';
    }).join('');

    // 争议
    var controvs = (s.controversies || []).map(function (c) {
      var sides = (c.sides || []).map(function (sd) { return '<span class="ct-side">' + esc(sd) + '</span>'; }).join('');
      return '<div class="controversy-item"><div class="ct-topic">' + esc(c.topic) + '</div>'
        + '<div class="ct-sides">' + sides + '</div>'
        + (c.note ? '<div class="ct-note">' + esc(c.note) + '</div>' : '')
        + '</div>';
    }).join('');

    // 接受史
    var reception = (s.reception || []).map(function (r) {
      return '<div class="reception-item"><div class="rc-era">' + esc(r.era) + '</div>'
        + '<div class="rc-reading">' + esc(r.reading) + '</div></div>';
    }).join('');

    // 关系
    var rels = (s.relations || []).map(function (r) {
      var t = SCHOOLS[r.to];
      return '<span class="relation-chip" data-rel="' + r.to + '">'
        + '<span class="rc-name">' + (t ? esc(t.name) : esc(r.to)) + '</span>'
        + '<span class="rc-type t-' + r.type + '">' + (RELATION_LABEL[r.type] || r.type) + '</span>'
        + '</span>';
    }).join('');

    // 学科交织
    var discs = (s.disciplines || []).map(function (d) {
      var dn = DISCIPLINE_NAME[d.d] || d.d;
      var kl = KIND_LABEL[d.kind] || d.kind;
      return '<span class="discipline-tag">' + dn + ' · ' + kl + (d.note ? ' — ' + esc(d.note) : '') + '</span>';
    }).join('');

    // 概念暗流：该学派的概念中，哪些有跨文明回响
    var flows = (s.concepts || []).filter(function (c) { return CONCEPT_FLOWS[c]; });
    var flowChips = flows.map(function (c) {
      var col = TRIBUTARY_COLOR[s.tributary] || '#C9A063';
      return '<button class="concept-flow-chip" data-concept="' + esc(c) + '" style="--c:' + col + '"><span class="cf-dot"></span>' + esc(c) + '</button>';
    }).join('');

    contentEl.innerHTML =
      '<div class="detail-hero" style="--sc:' + col + '">'
      + '<div class="detail-hero-top">'
      + '<div class="avatar-block" style="--sc:' + col + '">' + s.name.charAt(0) + '</div>'
      + '<div class="detail-name"><h2>' + esc(s.name) + '</h2>'
      + '<div class="en">' + esc(s.en) + '</div></div>'
      + '</div>'
      + '<div class="detail-meta">'
      + '<span class="meta-item">🌊 <b>' + (TRIBUTARY_NAME[s.tributary] || '') + '</b></span>'
      + '<span class="meta-item">⌛ ' + esc(s.era) + '</span>'
      + '</div>'
      + '</div>'
      + (s.timeAsked ? '<div class="time-asked"><span class="ta-label">时代之问</span>' + esc(s.timeAsked) + '</div>' : '')
      + '<div class="detail-body">'
      + (interps ? '<div class="d-block"><div class="d-block-title">多元阐释 · 不设唯一正确</div><div class="interp-list">' + interps + '</div></div>' : '')
      + (controvs ? '<div class="d-block"><div class="d-block-title">分歧与争议 · 活的张力</div>' + controvs + '</div>' : '')
      + (reception ? '<div class="d-block"><div class="d-block-title">接受史 · 后世如何重读</div><div class="reception-track">' + reception + '</div></div>' : '')
      + (rels ? '<div class="d-block"><div class="d-block-title">四轴发散 · 从它出发</div><div class="relation-chips">' + rels + '</div></div>' : '')
      + (flowChips ? '<div class="d-block"><div class="d-block-title">概念暗流 · 跨文明回响</div><div class="concept-flows">' + flowChips + '</div><div class="flow-path" id="flowPath"></div></div>' : '')
      + (discs ? '<div class="d-block"><div class="d-block-title">学科交织</div><div class="discipline-tags">' + discs + '</div></div>' : '')
      + '</div>';

    // 关系跳转
    contentEl.querySelectorAll('.relation-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var tid = chip.getAttribute('data-rel');
        if (SCHOOLS[tid]) openSchool(tid);
      });
    });

    // 概念暗流交互
    contentEl.querySelectorAll('.concept-flow-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var concept = chip.getAttribute('data-concept');
        var pathEl = document.getElementById('flowPath');
        contentEl.querySelectorAll('.concept-flow-chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');

        if (!pathEl) return;
        var flow = CONCEPT_FLOWS[concept];
        if (!flow) { pathEl.classList.remove('open'); return; }

        // 起始点：当前学派
        var nodes = [{ school: s.id, note: '起点 · 本义' }].concat(flow);
        // 去重（去掉与当前学派相同的）
        nodes = nodes.filter(function (n, i) { return i === 0 || n.school !== s.id; });

        var trail = nodes.map(function (n) {
          var t = SCHOOLS[n.school];
          if (!t) return '';
          var nc = TRIBUTARY_COLOR[t.tributary] || '#C9A063';
          return '<div class="fp-node" data-school="' + n.school + '" style="--c:' + nc + '">'
            + '<div class="fp-school">' + esc(t.name) + ' <span style="font-size:10.5px;color:var(--text-mute)">· ' + esc(TRIBUTARY_NAME[t.tributary] || '') + '</span></div>'
            + (n.note ? '<div class="fp-note">' + esc(n.note) + '</div>' : '')
            + '</div>';
        }).join('');

        pathEl.innerHTML = '<div class="fp-head"><div><b>「' + esc(concept) + '」</b> 的跨文明回响</div><button class="fp-close" aria-label="收起">&times;</button></div>'
          + '<div class="fp-trail">' + trail + '</div>';
        pathEl.classList.add('open');

        // 点击轨迹节点 → 跳转学派
        pathEl.querySelectorAll('.fp-node').forEach(function (node) {
          node.addEventListener('click', function () {
            var tid = node.getAttribute('data-school');
            if (SCHOOLS[tid]) openSchool(tid);
          });
        });
        // 收起
        pathEl.querySelector('.fp-close').addEventListener('click', function () {
          pathEl.classList.remove('open');
          chip.classList.remove('active');
        });
      });
    });

    openOverlay();
  }

  /* ─── 卡片点击 ─── */
  grid.addEventListener('click', function (ev) {
    var card = ev.target.closest('.school-card');
    if (card) openSchool(card.getAttribute('data-school'));
  });

  /* ─── 关闭 ─── */
  document.getElementById('detailClose').addEventListener('click', closeOverlay);
  overlay.addEventListener('click', function (ev) {
    if (ev.target === overlay) closeOverlay();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') closeOverlay();
  });
})();
</script>
</body>
